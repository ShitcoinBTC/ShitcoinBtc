<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = Math.min(window.innerWidth, 700);
canvas.height = Math.min(window.innerHeight, 900);

let player, bullets, enemies, boss, powerups, score, lives, level, gameRunning, keys = {}, enemyTimer, laser, shield, laserTimer, laserStacks, shieldTimer;

// Chain logos (colors) - 25 bosses, 25 chains
const CHAINS = [
  {name: 'ETH', color: '#627eea'},
  {name: 'SOL', color: '#9945FF'},
  {name: 'AVAX', color: '#E84142'},
  {name: 'BASE', color: '#0052FF'},
  {name: 'BNB', color: '#F0B90B'},
  {name: 'MATIC', color: '#8247E5'},
  {name: 'ARB', color: '#28A0F0'},
  {name: 'OP', color: '#FF0420'},
  {name: 'FTM', color: '#13b5ec'},
  {name: 'ONE', color: '#00DDAA'},
  {name: 'CELO', color: '#FBCC5C'},
  {name: 'MOVR', color: '#53CBC9'},
  {name: 'GLMR', color: '#F5B700'},
  {name: 'KAVA', color: '#FF433E'},
  {name: 'CRO', color: '#002D74'},
  {name: 'FUSE', color: '#B5F36A'},
  {name: 'METIS', color: '#00DACC'},
  {name: 'BOBA', color: '#CBFB45'},
  {name: 'SYS', color: '#0088cc'},
  {name: 'XDAI', color: '#48B9A9'},
  {name: 'EWT', color: '#A566FF'},
  {name: 'RSK', color: '#00B520'},
  {name: 'TLOS', color: '#571AFF'},
  {name: 'KLAY', color: '#FF0420'},
  {name: 'AURORA', color: '#78D64B'}
];
const MAX_LEVEL = 25;

function init() {
  score = 0;
  lives = 3;
  level = 1;
  laser = false;
  shield = false;
  laserTimer = 0;
  laserStacks = 0;
  shieldTimer = 0;
  // Ship grows with level
  const shipW = 50 + (level - 1) * 2;
  const shipH = 40 + (level - 1) * 1.5;
  player = { x: canvas.width/2, y: canvas.height-80, w: Math.min(shipW, 100), h: Math.min(shipH, 80), speed: 6 };
  bullets = [];
  enemies = [];
  powerups = [];
  boss = null;
  gameRunning = true;
  enemyTimer = 0;
  document.getElementById('gameover').style.display = 'none';
  document.getElementById('levelup').style.display = 'none';
  updateUI();
}

function getWeapon() {
  // Weapon upgrades: 1 to 8 bullets over 25 levels
  let tier, count;
  if (level <= 3) { tier = 1; count = 1; }
  else if (level <= 6) { tier = 2; count = 2; }
  else if (level <= 9) { tier = 3; count = 3; }
  else if (level <= 12) { tier = 4; count = 4; }
  else if (level <= 15) { tier = 5; count = 5; }
  else if (level <= 18) { tier = 6; count = 6; }
  else if (level <= 21) { tier = 7; count = 7; }
  else { tier = 8; count = 8; }
  
  return {
    count: count,
    damage: 1 + Math.floor((level - 1) / 6), // 1-5 damage
    size: 14 + tier * 2,
    tier: tier
  };
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('lvl').textContent = level;
}

function spawnEnemy() {
  enemyTimer++;
  
  // Spawn powerup bubbles occasionally (every ~15 seconds)
  if (enemyTimer % 900 === 0 && !boss) {
    const types = ['life', 'laser', 'shield', 'bomb'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({
      x: Math.random() * (canvas.width - 40),
      y: -40, w: 35, h: 35,
      speed: 1, type: type
    });
  }
  
  const spawnRate = Math.max(30, 140 - level * 4);
  
  // Boss at end of each level (after enough enemies)
  if (!boss && enemyTimer > 3600) {
    const chain = CHAINS[(level - 1) % CHAINS.length];
    // Harder bosses: more HP, but possible with upgraded weapons
    const bossHp = 30 + level * 12;
    boss = {
      x: canvas.width/2 - 75, y: -150, w: 150 + level*2, h: 120 + level*1.5,
      speed: 0.5 + level * 0.05, chain: chain.name, color: chain.color,
      hp: bossHp, maxHp: bossHp,
      type: 'boss'
    };
    return;
  }
  
  if (boss) return; // No regular enemies during boss
  
  if (enemyTimer % spawnRate === 0) {
    const type = Math.random();
    let enemy;
    const chainIdx = Math.floor(Math.random() * Math.min(level + 2, CHAINS.length));
    const chain = CHAINS[chainIdx];
    
    if (level <= 5) {
      // Early levels: rocks and bubbles
      const etype = type < 0.5 ? 'rock' : 'bubble';
      enemy = { 
        x: Math.random()*(canvas.width-40), y: -40, w: 40, h: 40, 
        speed: 1 + level*0.2 + Math.random()*1.5, 
        type: etype, chain: chain.name, color: chain.color, 
        hp: 1 + Math.floor(level/4) 
      };
    } else {
      // Later levels: faster, tougher, mixed
      const etype = type < 0.33 ? 'rock' : (type < 0.66 ? 'bubble' : 'diamond');
      enemy = { 
        x: Math.random()*(canvas.width-40), y: -40, w: 40, h: 40, 
        speed: 1.5 + level*0.25 + Math.random()*2, 
        type: etype, chain: chain.name, color: chain.color, 
        hp: 1 + Math.floor(level/3) 
      };
    }
    enemies.push(enemy);
  }
}

function update() {
  if (!gameRunning) return;
  
  if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
  if (keys['ArrowRight'] && player.x < canvas.width - player.w) player.x += player.speed;
  
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y -= 8;
    if (bullets[i].y < 0) bullets.splice(i, 1);
  }
  
  spawnEnemy();
  
  // Powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    powerups[i].y += powerups[i].speed;
    powerups[i].x += Math.sin(powerups[i].y * 0.03) * 1.5; // wobble
    
    if (powerups[i].y > canvas.height) {
      powerups.splice(i, 1);
      continue;
    }
    
    // Collect
    if (checkCollision(powerups[i], player)) {
      const type = powerups[i].type;
      powerups.splice(i, 1);
      if (type === 'life') {
        lives++;
        score += 50;
      } else if (type === 'laser') {
        // GOD TIER LASER: 15s base, 25s double, 35s triple
        if (laser) {
          laserStacks = Math.min(3, laserStacks + 1);
        } else {
          laser = true;
          laserStacks = 1;
        }
        // Set duration based on stacks
        if (laserStacks === 1) laserTimer = 900; // 15s
        else if (laserStacks === 2) laserTimer = 1500; // 25s
        else laserTimer = 2100; // 35s
      } else if (type === 'shield') {
        shield = true;
        shieldTimer = 600;
      } else if (type === 'bomb') {
        // Destroy all enemies
        for (let e of enemies) score += 10 * level;
        enemies = [];
        if (boss) {
          boss.hp -= 50; // Big damage to boss
          if (boss.hp <= 0) {
            score += 100 * level;
            boss = null;
            if (level >= MAX_LEVEL) gameWin();
            else levelComplete();
          }
        }
      }
      updateUI();
    }
  }
  
  // Timers
  if (laser) {
    laserTimer--;
    if (laserTimer <= 0) {
      laser = false;
      laserStacks = 0;
      // Back to base weapon of this level
    }
  }
  if (shield) {
    shieldTimer--;
    if (shieldTimer <= 0) shield = false;
  }
  
  // Laser: destroys everything in its path
  if (laser) {
    const laserX = player.x + player.w/2;
    const laserW = 20 + laserStacks * 10;
    
    // Kill enemies touching laser
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (enemies[i].x < laserX + laserW/2 && enemies[i].x + enemies[i].w > laserX - laserW/2) {
        enemies.splice(i, 1);
        score += 10 * level;
      }
    }
    updateUI();
    
    // Damage boss
    if (boss && boss.x < laserX + laserW/2 && boss.x + boss.w > laserX - laserW/2) {
      boss.hp -= 2; // 2 damage per frame = 120/sec
      if (boss.hp <= 0) {
        score += 100 * level;
        boss = null;
        updateUI();
        if (level >= MAX_LEVEL) gameWin();
        else levelComplete();
      }
    }
  }
  
  // Update enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    enemies[i].y += enemies[i].speed;
    
    // Bubble wobble
    if (enemies[i].type === 'bubble') {
      enemies[i].x += Math.sin(enemies[i].y * 0.05) * 2;
    }
    
    // Collision with player (shield protects)
    if (checkCollision(enemies[i], player)) {
      enemies.splice(i, 1);
      if (!shield) {
        lives--;
        updateUI();
        if (lives <= 0) gameOver();
      }
      continue;
    }
    
    if (enemies[i].y > canvas.height) { enemies.splice(i, 1); continue; }
    
    // Bullet collision
    for (let j = bullets.length - 1; j >= 0; j--) {
      if (checkCollision(bullets[j], enemies[i])) {
        const dmg = bullets[j].damage || 1;
        bullets.splice(j, 1);
        enemies[i].hp -= dmg;
        if (enemies[i].hp <= 0) {
          enemies.splice(i, 1);
          score += 10 * level;
          updateUI();
        }
        break;
      }
    }
  }
  
  // Boss
  if (boss) {
    if (boss.y < 50) boss.y += boss.speed;
    else {
      // Boss moves side to side
      boss.x += Math.sin(Date.now() * 0.001) * 2;
    }
    
    // Boss collision with player
    if (checkCollision(boss, player)) {
      lives = 0;
      updateUI();
      gameOver();
      return;
    }
    
    // Bullet collision with boss
    for (let j = bullets.length - 1; j >= 0; j--) {
      if (checkCollision(bullets[j], boss)) {
        const dmg = bullets[j].damage || 1;
        bullets.splice(j, 1);
        boss.hp -= dmg;
        if (boss.hp <= 0) {
          score += 100 * level;
          boss = null;
          updateUI();
          if (level >= MAX_LEVEL) {
            gameWin();
          } else {
            levelComplete();
          }
        }
        break;
      }
    }
  }
}

function checkCollision(a, b) {
  return a.x < b.x + b.w && a.x + (a.w||4) > b.x &&
         a.y < b.y + b.h && a.y + (a.h||10) > b.y;
}

function levelComplete() {
  gameRunning = false;
  document.getElementById('newlvl').textContent = level + 1;
  document.getElementById('levelup').style.display = 'block';
}

function nextLevel() {
  level++;
  document.getElementById('levelup').style.display = 'none';
  enemies = [];
  powerups = [];
  boss = null;
  enemyTimer = 0;
  // Grow ship
  const shipW = 50 + (level - 1) * 2;
  const shipH = 40 + (level - 1) * 1.5;
  player.w = Math.min(shipW, 100);
  player.h = Math.min(shipH, 80);
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
  gameRunning = true;
  updateUI();
  // Show weapon upgrade message
  const w = getWeapon();
  const thresholds = [4, 7, 10, 13, 16, 19, 22];
  if (thresholds.includes(level)) {
    setTimeout(() => alert(`Weapon upgraded! ${w.count} bullets, ${w.damage} damage!`), 100);
  }
}

// Load sprites
const sprites = {
  ship1: new Image(),
  ship2: new Image(),
  ship3: new Image(),
  rock: new Image(),
  bubble: new Image(),
  monster: new Image(),
  bossEth: new Image(),
  bossSol: new Image()
};
sprites.ship1.src = '/game-assets/ship1.webp';
sprites.ship2.src = '/game-assets/ship2.webp';
sprites.ship3.src = '/game-assets/ship3.webp';
sprites.rock.src = '/game-assets/enemy-rock.webp';
sprites.bubble.src = '/game-assets/enemy-bubble.webp';
sprites.monster.src = '/game-assets/enemy-monster.webp';
sprites.bossEth.src = '/game-assets/boss-eth.webp';
sprites.bossSol.src = '/game-assets/boss-sol.webp';

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Stars
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 80; i++) {
    const y = (Math.random() * canvas.height + Date.now()*0.05) % canvas.height;
    ctx.fillRect(Math.random() * canvas.width, y, 1, 1);
  }
  
  if (!gameRunning && document.getElementById('levelup').style.display === 'block') return;
  if (!gameRunning) return;
  
  // Player: Mr. Shitoshi spaceship sprite (changes with level)
  const shipSprite = level <= 8 ? sprites.ship1 : (level <= 16 ? sprites.ship2 : sprites.ship3);
  if (shipSprite.complete && shipSprite.naturalWidth > 0) {
    ctx.drawImage(shipSprite, player.x, player.y, player.w, player.h);
  } else {
    // Fallback: Bitcoin orange ship
    ctx.fillStyle = '#F7931A';
    ctx.beginPath();
    ctx.moveTo(player.x + player.w/2, player.y);
    ctx.lineTo(player.x + player.w, player.y + player.h);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('₿', player.x + player.w/2, player.y + player.h - 6);
  }
  
  // Shield bubble
  if (shield) {
    ctx.strokeStyle = '#00f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x + player.w/2, player.y + player.h/2, player.w/2 + 10, 0, Math.PI*2);
    ctx.stroke();
  }
  
  // Laser beam (god tier)
  if (laser) {
    const laserX = player.x + player.w/2;
    const laserW = 20 + laserStacks * 10;
    // Outer glow
    ctx.fillStyle = `rgba(255, 0, 255, 0.3)`;
    ctx.fillRect(laserX - laserW/2 - 5, 0, laserW + 10, player.y);
    // Core beam
    ctx.fillStyle = '#f0f';
    ctx.fillRect(laserX - laserW/2, 0, laserW, player.y);
    // White hot center
    ctx.fillStyle = '#fff';
    ctx.fillRect(laserX - 3, 0, 6, player.y);
    
    // Timer display
    ctx.fillStyle = '#f0f';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(`LASER ${Math.ceil(laserTimer/60)}s x${laserStacks}`, laserX, player.y - 15);
  }
  
  // Rapid fire indicator (removed, replaced by laser)
  // Shield bubble
  
  // Bullets: shit coins (cooler each tier, 1-8)
  for (let b of bullets) {
    const tier = b.tier || 1;
    ctx.font = `${b.size || 16}px serif`;
    ctx.textAlign = 'center';
    if (tier === 1) {
      ctx.fillText('💩', b.x, b.y);
    } else if (tier === 2) {
      ctx.shadowColor = '#F7931A';
      ctx.shadowBlur = 8;
      ctx.fillText('💩', b.x, b.y);
      ctx.shadowBlur = 0;
    } else if (tier === 3) {
      ctx.fillText('🔥', b.x, b.y - 8);
      ctx.fillText('💩', b.x, b.y);
    } else if (tier === 4) {
      ctx.fillText('⚡', b.x, b.y - 8);
      ctx.fillText('💩', b.x, b.y);
    } else if (tier === 5) {
      ctx.fillText('💥', b.x, b.y - 8);
      ctx.fillText('💩', b.x, b.y);
    } else if (tier === 6) {
      ctx.shadowColor = '#ff0';
      ctx.shadowBlur = 12;
      ctx.fillText('💩', b.x, b.y);
      ctx.shadowBlur = 0;
    } else if (tier === 7) {
      ctx.fillText('☄️', b.x, b.y - 8);
      ctx.fillText('💩', b.x, b.y);
    } else {
      // Tier 8: Ultimate rainbow shit
      ctx.fillText('🌈', b.x, b.y - 10);
      ctx.shadowColor = '#f0f';
      ctx.shadowBlur = 15;
      ctx.fillText('💩', b.x, b.y);
      ctx.shadowBlur = 0;
    }
  }
  
  // Powerups: bubbles with icons
  for (let p of powerups) {
    // Bubble
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w/2, 0, Math.PI*2);
    ctx.stroke();
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(p.x + p.w/2 - 5, p.y + p.h/2 - 5, 5, 0, Math.PI*2);
    ctx.fill();
    // Icon
    ctx.font = '18px serif';
    ctx.textAlign = 'center';
    let icon = '';
    if (p.type === 'life') icon = '❤️';
    else if (p.type === 'laser') icon = '🔫';
    else if (p.type === 'shield') icon = '🛡️';
    else if (p.type === 'bomb') icon = '💣';
    ctx.fillText(icon, p.x + p.w/2, p.y + p.h/2 + 6);
  }
  
  // Enemies: sprite images
  for (let e of enemies) {
    const color = e.color || '#627eea';
    let sprite = null;
    if (e.type === 'rock') sprite = sprites.rock;
    else if (e.type === 'bubble') sprite = sprites.bubble;
    else sprite = sprites.monster;
    
    if (sprite.complete && sprite.naturalWidth > 0) {
      ctx.drawImage(sprite, e.x, e.y, e.w, e.h);
    } else {
      // Fallback to canvas drawing
      if (e.type === 'rock') {
        ctx.fillStyle = '#555';
        ctx.beginPath();
        ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, 0, Math.PI*2);
        ctx.fill();
      } else if (e.type === 'bubble') {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, 0, Math.PI*2);
        ctx.stroke();
      } else {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(e.x + e.w/2, e.y);
        ctx.lineTo(e.x + e.w, e.y + e.h/2);
        ctx.lineTo(e.x + e.w/2, e.y + e.h);
        ctx.lineTo(e.x, e.y + e.h/2);
        ctx.closePath();
        ctx.fill();
      }
    }
    // Chain label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(e.chain, e.x + e.w/2, e.y + e.h + 12);
  }
  
  // Boss: sprite image (alternates ETH/SOL bosses by level)
  if (boss) {
    const bossSprite = (level % 2 === 0) ? sprites.bossEth : sprites.bossSol;
    if (bossSprite.complete && bossSprite.naturalWidth > 0) {
      ctx.drawImage(bossSprite, boss.x, boss.y, boss.w, boss.h);
    } else {
      const color = boss.color;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(boss.x, boss.y, boss.w, boss.h, 20);
      ctx.fill();
    }
    // Chain logo
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(boss.chain, boss.x + boss.w/2, boss.y + boss.h/2 + 15);
    // Level indicator
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('BOSS LVL ' + level, boss.x + boss.w/2, boss.y + boss.h - 10);
    // HP bar
    ctx.fillStyle = '#f00';
    ctx.fillRect(boss.x, boss.y - 12, boss.w, 8);
    ctx.fillStyle = '#0f0';
    ctx.fillRect(boss.x, boss.y - 12, boss.w * (boss.hp / boss.maxHp), 8);
  }
}

// Pay 0.001 SOL with Phantom wallet
async function payWithPhantom() {
  try {
    const provider = window.solana;
    if (!provider || !provider.isPhantom) {
      alert('Phantom wallet not found. Get it at phantom.app, then come back.');
      window.open('https://phantom.app/', '_blank');
      return;
    }
    await provider.connect();
    const connection = new solanaWeb3.Connection('https://api.mainnet-beta.solana.com', 'confirmed');
    const tx = new solanaWeb3.Transaction().add(
      solanaWeb3.SystemProgram.transfer({
        fromPubkey: provider.publicKey,
        toPubkey: new solanaWeb3.PublicKey('3riHbnaAnERLB5khbfHtQpiDBVVvKikwX7Ee6AaE7Ls4'),
        lamports: 1000000 // 0.001 SOL
      })
    );
    tx.feePayer = provider.publicKey;
    const { blockhash } = await connection.getLatestBlockhash();
    tx.recentBlockhash = blockhash;
    const signed = await provider.signTransaction(tx);
    const sig = await connection.sendRawTransaction(signed.serialize());
    alert('Paid! Tx: ' + sig.slice(0, 12) + '...');
    // Record payment in pool
    fetch('http://77.42.74.252:5002/api/game/deposit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({amount_shit: 2, note: 'SOL entry ' + sig})
    }).catch(() => {});
    startGame();
  } catch (e) {
    alert('Payment failed: ' + (e.message || e));
  }
}

// Pay 0.0000436 ETH with Coinbase Wallet (or any injected EVM wallet)
// chainId: '0x1' = Ethereum, '0x2105' = Base
async function payWithCoinbase(chainId) {
  try {
    const provider = window.ethereum;
    if (!provider) {
      alert('No wallet found. Get Coinbase Wallet at coinbase.com/wallet, then come back.');
      window.open('https://www.coinbase.com/wallet', '_blank');
      return;
    }
    const accounts = await provider.request({ method: 'eth_requestAccounts' });
    // Switch to the right network
    try {
      await provider.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: chainId }]
      });
    } catch (switchErr) {
      if (switchErr.code === 4902 && chainId === '0x2105') {
        await provider.request({
          method: 'wallet_addEthereumChain',
          params: [{ chainId: '0x2105', chainName: 'Base', nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 }, rpcUrls: ['https://mainnet.base.org'], blockExplorerUrls: ['https://basescan.org'] }]
        });
      } else {
        throw switchErr;
      }
    }
    const txHash = await provider.request({
      method: 'eth_sendTransaction',
      params: [{
        from: accounts[0],
        to: '0x67de87a2419522265f7d7b9f50f3810b3a2111d3',
        value: '0x' + (43600000000000).toString(16) // 0.0000436 ETH in wei
      }]
    });
    alert('Paid! Tx: ' + txHash.slice(0, 12) + '...');
    fetch('http://77.42.74.252:5002/api/game/deposit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},

    }).catch(() => {});
    startGame();
  } catch (e) {
    alert('Payment failed: ' + (e.message || e));
  }
}

function shoot() {
  if (!gameRunning) return;
  const w = getWeapon();
  const cx = player.x + player.w/2;
  // Spread bullets
  for (let i = 0; i < w.count; i++) {
    const offset = (i - (w.count - 1) / 2) * 12;
    bullets.push({ 
      x: cx + offset, y: player.y, 
      damage: w.damage, size: w.size, tier: w.tier 
    });
  }
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { shoot(); e.preventDefault(); }
});
document.addEventListener('keyup', e => keys[e.key] = false);

let touchX = null;
canvas.addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX;
  shoot();
  e.preventDefault();
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  if (touchX !== null) {
    let dx = e.touches[0].clientX - touchX;
    player.x = Math.max(0, Math.min(canvas.width - player.w, player.x + dx));
    touchX = e.touches[0].clientX;
  }
  e.preventDefault();
}, {passive: false});
canvas.addEventListener('touchend', () => touchX = null);
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  player.x = Math.max(0, Math.min(canvas.width - player.w, e.clientX - rect.left - player.w/2));
});
canvas.addEventListener('click', shoot);

// Game starts after payment (see startGame)
// init() is called from startGame()
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
